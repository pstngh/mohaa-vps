name: Build blocklist

# When the ban list (or the converter) changes, regenerate the nftables file,
# validate its syntax, and commit it back so the server only has to load it.
on:
  push:
    paths:
      - ipfilter.cfg
      - blocklist-update.sh
      - .github/workflows/blocklist.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables

      - name: Convert ipfilter.cfg -> mohaa-blocklist.nft
        run: GENERATE_ONLY=1 bash blocklist-update.sh ipfilter.cfg mohaa-blocklist.nft

      - name: Validate nftables syntax
        run: sudo nft -c -f mohaa-blocklist.nft

      - name: Commit regenerated file
        run: |
          if git diff --quiet -- mohaa-blocklist.nft; then
            echo "mohaa-blocklist.nft is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mohaa-blocklist.nft
          git commit -m "ci: regenerate mohaa-blocklist.nft from ipfilter.cfg [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
